# FILE: charts/nexustreasury/templates/monitoring/prometheus-rules.yaml
# Prometheus alerting rules for NexusTreasury

apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: nexustreasury-alerts
  namespace: nexus-observability
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    # ─────────────────────────────────────────────────────────────────────
    # Trade Service SLA Alerts
    # ─────────────────────────────────────────────────────────────────────
    - name: nexus.trading.sla
      interval: 30s
      rules:
        - alert: TradeBookingLatencyHigh
          expr: |
            histogram_quantile(0.99,
              rate(http_request_duration_ms_bucket{
                service="trade-service",
                path="/v1/trades",
                method="POST"
              }[5m])
            ) > 100
          for: 2m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "Trade booking P99 latency > 100ms SLA"
            description: "Trade Service P99 latency is {{ $value }}ms. SLA is 100ms."
            runbook: "https://runbooks.nexustreasury.com/trade-service-latency"

        - alert: TradeServiceErrorRateHigh
          expr: |
            rate(http_requests_total{
              service="trade-service",
              status=~"5.."
            }[5m]) /
            rate(http_requests_total{
              service="trade-service"
            }[5m]) > 0.01
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "Trade Service error rate > 1%"
            description: "Error rate is {{ $value | humanizePercentage }}. Investigate immediately."

    # ─────────────────────────────────────────────────────────────────────
    # Kafka Consumer Lag Alerts
    # ─────────────────────────────────────────────────────────────────────
    - name: nexus.kafka.lag
      rules:
        - alert: KafkaConsumerLagHigh
          expr: |
            kafka_consumer_group_lag{
              namespace="nexus-prod"
            } > 10000
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Kafka consumer lag > 10,000 messages"
            description: "Consumer group {{ $labels.consumer_group }} is {{ $value }} messages behind on topic {{ $labels.topic }}"

    # ─────────────────────────────────────────────────────────────────────
    # ALM / Risk Alerts — Business-critical
    # ─────────────────────────────────────────────────────────────────────
    - name: nexus.risk.limits
      rules:
        - alert: LimitBreachDetected
          expr: |
            increase(nexus_limit_breaches_total[5m]) > 0
          for: 0m   # Alert immediately on any limit breach
          labels:
            severity: critical
            team: risk
          annotations:
            summary: "Risk limit breach detected"
            description: "{{ $value }} limit breach(es) detected. Risk team must review immediately."
            runbook: "https://runbooks.nexustreasury.com/limit-breach"

        - alert: LCRBelowMinimum
          expr: |
            nexus_lcr_ratio < 1.0
          for: 5m
          labels:
            severity: critical
            team: alm
          annotations:
            summary: "LCR below regulatory minimum of 100%"
            description: "Entity {{ $labels.legal_entity }} LCR is {{ $value | humanizePercentage }}. Regulatory minimum is 100%."

    # ─────────────────────────────────────────────────────────────────────
    # Security Alerts
    # ─────────────────────────────────────────────────────────────────────
    - name: nexus.security
      rules:
        - alert: AuthFailureSpike
          expr: |
            rate(keycloak_failed_login_attempts_total[5m]) > 10
          for: 2m
          labels:
            severity: warning
            team: security
          annotations:
            summary: "Spike in authentication failures — possible brute force"
            description: "{{ $value }} failed login attempts per second. Possible brute force attack."

        - alert: CriticalCVEFound
          expr: |
            trivy_vulnerabilities_total{severity="CRITICAL"} > 0
          for: 0m
          labels:
            severity: critical
            team: security
          annotations:
            summary: "Critical CVE detected in container image"
            description: "{{ $value }} critical vulnerabilities found. Auto-patch pipeline triggered."

