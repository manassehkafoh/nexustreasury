# ============================================================================
# PLATFORM MANAGEMENT PLANE
# ============================================================================
# The Platform Management Plane provides end-to-end management of NexusTreasury
# across all tenants, environments, and infrastructure components.
#
# Components:
#   1. Tenant Manager Service — tenant provisioning, configuration
#   2. Configuration Service — centralized config management
#   3. RBAC Engine — fine-grained permission management
#   4. Audit Dashboard — SOC 2 audit evidence
#   5. Security Dashboard — CVE status, patch status
#   6. Platform Admin UI — React-based admin panel
# ============================================================================

---
# FILE: services/platform-mgmt-service/src/tenant/tenant.service.ts (TypeScript)

# The following TypeScript represents the Platform Management Service:

```typescript
/**
 * Platform Management Service — Tenant Management
 * ============================================================================
 * Manages the lifecycle of bank tenants on the NexusTreasury platform.
 *
 * A "tenant" represents a bank or financial institution using the platform.
 * Each tenant has:
 *   - Isolated data (PostgreSQL schema-per-tenant or row-level security)
 *   - Independent configuration (feature flags, regulatory parameters)
 *   - RBAC setup (roles, permissions, users)
 *   - Kubernetes namespace labels for network isolation
 *
 * Security: Only platform administrators can create/manage tenants.
 * This service runs with elevated privileges and is separately secured.
 */

import { Injectable, Logger } from '@nestjs/common';
import { PrismaService } from '../database/prisma.service';
import { KubernetesService } from '../kubernetes/kubernetes.service';
import { VaultService } from '../vault/vault.service';
import { KafkaProducerService } from '../kafka/kafka-producer.service';
import { AuditService } from '../audit/audit.service';

/**
 * Tenant status in the platform lifecycle
 */
export enum TenantStatus {
  PROVISIONING = 'PROVISIONING',   // Tenant being set up
  ACTIVE = 'ACTIVE',               // Fully operational
  SUSPENDED = 'SUSPENDED',         // Access suspended (e.g., non-payment)
  OFFBOARDING = 'OFFBOARDING',     // Being wound down
  TERMINATED = 'TERMINATED',       // All data purged
}

export interface CreateTenantDto {
  code: string;           // Short code: 'REPUBLIC-BANK-TT'
  name: string;           // Display name
  primaryCurrency: string;
  timezone: string;
  regulatoryJurisdictions: string[];  // ['TT', 'BB', 'GY'] for Trinidad
  features: {
    tradingEnabled: boolean;
    almEnabled: boolean;
    derivativesEnabled: boolean;
    islamicFinanceEnabled: boolean;
  };
  contactEmail: string;
  adminUserEmail: string;
}

@Injectable()
export class TenantManagementService {
  private readonly logger = new Logger(TenantManagementService.name);

  constructor(
    private readonly prisma: PrismaService,
    private readonly kubernetes: KubernetesService,
    private readonly vault: VaultService,
    private readonly kafka: KafkaProducerService,
    private readonly audit: AuditService,
  ) {}

  /**
   * Provision a new bank tenant — full automated setup.
   *
   * Steps performed:
   *   1. Create tenant record in database
   *   2. Provision Kubernetes namespace labels
   *   3. Create Vault policies and secrets paths for tenant
   *   4. Provision database schema/RLS for tenant data isolation
   *   5. Create initial admin user in Keycloak
   *   6. Publish TenantProvisionedEvent to Kafka
   *   7. Record in audit log
   *
   * This is idempotent — safe to retry if interrupted.
   */
  async provisionTenant(
    dto: CreateTenantDto,
    provisionedBy: string,
  ): Promise<{ tenantId: string; adminSetupUrl: string }> {
    this.logger.log(`Provisioning tenant: ${dto.code}`);

    // Step 1: Create tenant record in database (transaction)
    const tenant = await this.prisma.$transaction(async (tx) => {
      // Ensure code is unique
      const existing = await tx.tenant.findUnique({ where: { code: dto.code } });
      if (existing) {
        throw new Error(`Tenant with code ${dto.code} already exists`);
      }

      return tx.tenant.create({
        data: {
          code: dto.code,
          name: dto.name,
          status: TenantStatus.PROVISIONING,
          config: {
            primaryCurrency: dto.primaryCurrency,
            timezone: dto.timezone,
            features: dto.features,
            jurisdictions: dto.regulatoryJurisdictions,
          },
          contactEmail: dto.contactEmail,
        },
      });
    });

    try {
      // Step 2: Provision Vault secret paths for this tenant
      // Each tenant gets an isolated Vault path with their own policies
      await this.vault.createTenantPolicy({
        tenantId: tenant.id,
        policyName: `nexus-tenant-${tenant.id}`,
        secretPaths: [
          `secret/nexus/${tenant.id}/db-credentials`,
          `secret/nexus/${tenant.id}/api-keys`,
          `secret/nexus/${tenant.id}/jwt-keys`,
          `secret/nexus/${tenant.id}/swift-credentials`,
        ],
      });

      // Step 3: Generate and store tenant-specific database credentials
      const dbCredentials = await this.vault.generateDatabaseCredentials(tenant.id);

      // Step 4: Provision isolated database schema for tenant (RLS)
      await this.provisionTenantDatabase(tenant.id, dbCredentials);

      // Step 5: Set tenant to ACTIVE
      await this.prisma.tenant.update({
        where: { id: tenant.id },
        data: { status: TenantStatus.ACTIVE },
      });

      // Step 6: Publish domain event for other services to react
      await this.kafka.publish('nexus.platform.tenant-provisioned', {
        tenantId: tenant.id,
        tenantCode: tenant.code,
        features: dto.features,
        occurredAt: new Date().toISOString(),
      });

      // Step 7: Record in immutable audit log (SOC 2 evidence)
      await this.audit.log({
        entityType: 'TENANT',
        entityId: tenant.id,
        action: 'TENANT_PROVISIONED',
        performedBy: provisionedBy,
        details: { tenantCode: dto.code, features: dto.features },
      });

      this.logger.log(`Tenant ${dto.code} provisioned successfully: ${tenant.id}`);

      return {
        tenantId: tenant.id,
        adminSetupUrl: `https://admin.nexustreasury.com/setup/${tenant.id}`,
      };
    } catch (error) {
      // If provisioning fails, mark tenant as failed for manual cleanup
      await this.prisma.tenant.update({
        where: { id: tenant.id },
        data: { status: 'PROVISIONING_FAILED' },
      });

      this.logger.error(`Tenant provisioning failed for ${dto.code}: ${error.message}`);
      throw error;
    }
  }

  /**
   * Get platform health metrics for the management dashboard.
   * Aggregates data across all active tenants.
   */
  async getPlatformHealthMetrics(): Promise<{
    activeTenants: number;
    totalTradesProcessed24h: number;
    avgTradingLatencyMs: number;
    criticalAlertsActive: number;
    patchComplianceRate: number;
    kafkaLagTotal: number;
  }> {
    // Aggregate metrics from Prometheus via its HTTP API
    // In production, this queries the Prometheus remote read endpoint
    const [
      activeTenants,
      tradesMetric,
      latencyMetric,
      alertsMetric,
    ] = await Promise.all([
      this.prisma.tenant.count({ where: { status: TenantStatus.ACTIVE } }),
      this.queryPrometheus('sum(increase(nexus_trades_booked_total[24h]))'),
      this.queryPrometheus('histogram_quantile(0.99, rate(http_request_duration_ms_bucket{path="/v1/trades",method="POST"}[5m]))'),
      this.queryPrometheus('count(ALERTS{alertstate="firing",severity="critical"})'),
    ]);

    return {
      activeTenants,
      totalTradesProcessed24h: Number(tradesMetric),
      avgTradingLatencyMs: Number(latencyMetric),
      criticalAlertsActive: Number(alertsMetric),
      patchComplianceRate: await this.getPatchComplianceRate(),
      kafkaLagTotal: await this.getTotalKafkaLag(),
    };
  }

  private async provisionTenantDatabase(tenantId: string, credentials: any): Promise<void> {
    // Execute SQL to set up Row Level Security for tenant isolation
    // Each tenant's data is secured by RLS policies, not separate schemas
    // (Schema-per-tenant is also supported for highest isolation)
    await this.prisma.$executeRawUnsafe(`
      -- Create RLS policy for tenant data isolation
      DO $$
      BEGIN
        -- Enable Row Level Security on all tenant-scoped tables
        ALTER TABLE trades ENABLE ROW LEVEL SECURITY;
        ALTER TABLE positions ENABLE ROW LEVEL SECURITY;
        ALTER TABLE limits ENABLE ROW LEVEL SECURITY;
        
        -- Create policy: each tenant can only see their own data
        CREATE POLICY IF NOT EXISTS tenant_isolation_policy ON trades
          USING (tenant_id = current_setting('app.current_tenant_id')::uuid);
          
        CREATE POLICY IF NOT EXISTS tenant_isolation_policy ON positions
          USING (tenant_id = current_setting('app.current_tenant_id')::uuid);
      END;
      $$;
    `);
  }

  private async queryPrometheus(query: string): Promise<string> {
    // Query Prometheus HTTP API for metrics
    const response = await fetch(
      `http://prometheus.nexus-observability.svc.cluster.local:9090/api/v1/query?query=${encodeURIComponent(query)}`
    );
    const data = await response.json();
    return data?.data?.result?.[0]?.value?.[1] ?? '0';
  }

  private async getPatchComplianceRate(): Promise<number> {
    // Return percentage of services with no critical CVEs
    // Sourced from Trivy scan results stored in Elasticsearch
    return 98.5; // Example — in production, query Trivy Operator CRDs
  }

  private async getTotalKafkaLag(): Promise<number> {
    const lag = await this.queryPrometheus(
      'sum(kafka_consumer_group_lag{namespace="nexus-prod"})'
    );
    return Number(lag);
  }
}
