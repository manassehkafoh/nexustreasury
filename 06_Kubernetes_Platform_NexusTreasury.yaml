# NexusTreasury — Kubernetes Deployment & Platform Management Plane
# ============================================================================
# This document contains:
#   1. Kubernetes Namespace and NetworkPolicy (Cilium)
#   2. Helm chart structure for Trade Service (representative)
#   3. Platform Management Plane architecture
#   4. Grafana Dashboard configuration
#   5. Alerting rules
# ============================================================================

---
# FILE: charts/nexustreasury/templates/namespaces.yaml
# Defines all namespaces with enforced labels for Cilium NetworkPolicy

apiVersion: v1
kind: Namespace
metadata:
  name: nexus-prod
  labels:
    name: nexus-prod
    environment: production
    # These labels are used by Cilium NetworkPolicy for namespace-based selection
    nexus.io/zone: app
    nexus.io/tenant: shared
  annotations:
    # OPA Gatekeeper will enforce policies in this namespace
    nexus.io/security-policy: "strict"
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-data
  labels:
    name: nexus-data
    environment: production
    nexus.io/zone: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-platform
  labels:
    name: nexus-platform
    environment: production
    nexus.io/zone: platform
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-observability
  labels:
    name: nexus-observability
    environment: production
    nexus.io/zone: observability
---
apiVersion: v1
kind: Namespace
metadata:
  name: nexus-security
  labels:
    name: nexus-security
    environment: production
    nexus.io/zone: security

---
# FILE: charts/nexustreasury/templates/network-policies/default-deny.yaml
# Cilium NetworkPolicy — default deny all ingress and egress
# All communication must be explicitly allowed below.
# This implements Zero Trust: deny all, permit explicitly.

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: default-deny-all
  namespace: nexus-prod
spec:
  # Apply to all pods in the namespace
  endpointSelector: {}
  # Default deny all ingress — no pod can receive traffic unless explicitly allowed
  ingress:
    - {}
  # Default deny all egress — no pod can send traffic unless explicitly allowed
  egress:
    - {}

---
# FILE: charts/nexustreasury/templates/network-policies/trade-service.yaml
# Cilium L7 NetworkPolicy for Trade Service
# Allows only expected communication patterns — enforced at kernel level via eBPF

apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: trade-service-policy
  namespace: nexus-prod
spec:
  endpointSelector:
    matchLabels:
      app: trade-service
  
  # ── INGRESS: Who can call Trade Service ─────────────────────────────────
  ingress:
    # Allow inbound from API Gateway only (not direct client access)
    - fromEndpoints:
        - matchLabels:
            app: api-gateway
            namespace: nexus-ingress
      toPorts:
        - ports:
            - port: "4001"
              protocol: TCP
          rules:
            # L7 HTTP policy — only specific methods and paths allowed
            http:
              - method: "POST"
                path: "/v1/trades"
              - method: "GET"
                path: "/v1/trades.*"
              - method: "PATCH"
                path: "/v1/trades/.*"
              - method: "GET"
                path: "/health/.*"
              - method: "GET"
                path: "/metrics"
    
    # Allow inbound gRPC from Risk Service (pre-deal limit checks)
    - fromEndpoints:
        - matchLabels:
            app: risk-service
      toPorts:
        - ports:
            - port: "4101"   # gRPC port
              protocol: TCP
  
  # ── EGRESS: What Trade Service can call ──────────────────────────────────
  egress:
    # Allow outbound to PostgreSQL in data namespace
    - toEndpoints:
        - matchLabels:
            app: postgresql
            namespace: nexus-data
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    
    # Allow outbound to Redis in data namespace
    - toEndpoints:
        - matchLabels:
            app: redis
            namespace: nexus-data
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    
    # Allow outbound to Kafka in data namespace (event publishing)
    - toEndpoints:
        - matchLabels:
            app: kafka
            namespace: nexus-data
      toPorts:
        - ports:
            - port: "9092"
              protocol: TCP
    
    # Allow outbound to HashiCorp Vault (secrets retrieval)
    - toEndpoints:
        - matchLabels:
            app: vault
            namespace: nexus-platform
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    
    # Allow outbound to Keycloak (token validation via JWKS endpoint)
    - toEndpoints:
        - matchLabels:
            app: keycloak
            namespace: nexus-platform
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    
    # Allow DNS resolution (required for service discovery)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
              
    # Allow outbound to OpenTelemetry Collector (traces + metrics)
    - toEndpoints:
        - matchLabels:
            app: otel-collector
            namespace: nexus-observability
      toPorts:
        - ports:
            - port: "4317"   # OTLP gRPC
              protocol: TCP

---
# FILE: charts/nexustreasury/templates/deployments/trade-service.yaml
# Kubernetes Deployment for Trade Service with security hardening

apiVersion: apps/v1
kind: Deployment
metadata:
  name: trade-service
  namespace: nexus-prod
  labels:
    app: trade-service
    version: "{{ .Values.services.trade_service.image.tag }}"
    nexus.io/component: backend
    nexus.io/context: trading
  annotations:
    # ArgoCD tracking annotation
    argocd.argoproj.io/sync-wave: "2"
spec:
  # Start with 3 replicas; HPA will scale based on CPU/RPS
  replicas: {{ .Values.services.trade_service.replicas | default 3 }}
  
  selector:
    matchLabels:
      app: trade-service
  
  # Rolling update strategy — zero downtime deployments
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never have more than 1 pod unavailable during update
      maxUnavailable: 1
      # Allow 1 extra pod during update (25% surge)
      maxSurge: 1
  
  template:
    metadata:
      labels:
        app: trade-service
        version: "{{ .Values.services.trade_service.image.tag }}"
        slot: "{{ .Values.deployment.slot | default 'blue' }}"
      annotations:
        # Force pod restart when config changes (hash of ConfigMap)
        checksum/config: {{ include (print $.Template.BasePath "/configmaps/trade-service.yaml") . | sha256sum }}
        # Prometheus scrape annotations
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    
    spec:
      # Security Context — Pod level
      securityContext:
        # Run all processes as non-root GID
        runAsGroup: 1001
        # Prevent writing to root filesystem
        fsGroup: 1001
        # Prevent privilege escalation at OS level
        seccompProfile:
          type: RuntimeDefault
      
      # Service account with minimal Kubernetes API permissions
      serviceAccountName: trade-service
      
      # Prefer spreading pods across availability zones
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: trade-service
      
      # Init container — wait for database and Kafka to be ready
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgresql.nexus-data.svc.cluster.local 5432; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
              echo "PostgreSQL is ready"
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      
      containers:
        - name: trade-service
          image: "{{ .Values.global.registry }}/trade-service:{{ .Values.services.trade_service.image.tag }}"
          
          # Container Security Context — enforces principle of least privilege
          securityContext:
            runAsNonRoot: true        # Container must not run as root
            runAsUser: 1001           # Run as nexus user (matches Dockerfile)
            allowPrivilegeEscalation: false  # Cannot gain more privileges
            readOnlyRootFilesystem: true     # Cannot write to container filesystem
            capabilities:
              drop:
                - ALL                 # Drop all Linux capabilities (POSIX)
              # No capabilities added — application needs none
          
          ports:
            - name: http
              containerPort: 4001
              protocol: TCP
            - name: grpc
              containerPort: 4101
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          
          env:
            # Application configuration — injected from ConfigMap
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4001"
            - name: LOG_LEVEL
              value: "{{ .Values.global.logLevel | default 'info' }}"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: nexus-config
                  key: kafka.brokers
            
            # Secrets from Vault via Vault Agent injector (not ENV directly)
            # Database URL, JWT secrets, API keys come from Vault-injected files
            - name: VAULT_ADDR
              value: "http://vault.nexus-platform.svc.cluster.local:8200"
            - name: VAULT_ROLE
              value: "trade-service"
            
            # OpenTelemetry configuration
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.nexus-observability.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: "trade-service"
            - name: OTEL_SERVICE_VERSION
              value: "{{ .Values.services.trade_service.image.tag }}"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "deployment.environment=production,nexus.context=trading"
          
          # Liveness probe — if this fails, pod is killed and restarted
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
              scheme: HTTP
            initialDelaySeconds: 30   # Wait for Node.js startup
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 5
          
          # Readiness probe — if this fails, pod is removed from load balancer
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          
          # Startup probe — gives extra time during initial startup
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30      # 30 × 2s = 60 seconds max startup
            periodSeconds: 2
          
          # Resource limits — prevent noisy neighbour issues
          resources:
            requests:
              cpu: "250m"         # 0.25 CPU cores guaranteed
              memory: "512Mi"     # 512MB RAM guaranteed
            limits:
              cpu: "1000m"        # Max 1 CPU core
              memory: "1Gi"       # Max 1GB RAM — OOM kill if exceeded
          
          # Volume mounts for Vault-injected secrets and writable tmp
          volumeMounts:
            - name: vault-secrets
              mountPath: /vault/secrets
              readOnly: true
            - name: tmp-dir
              mountPath: /tmp   # Only writable volume — for temp files
      
      volumes:
        # Vault Agent injector writes secrets here as files
        - name: vault-secrets
          emptyDir:
            medium: Memory   # In-memory volume — secrets never hit disk
        # Writable /tmp directory (read-only root filesystem requires this)
        - name: tmp-dir
          emptyDir: {}
      
      # Graceful shutdown — wait for in-flight requests to complete
      terminationGracePeriodSeconds: 60

---
# FILE: charts/nexustreasury/templates/hpa/trade-service-hpa.yaml
# Horizontal Pod Autoscaler — scales on CPU and custom RPS metric

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: trade-service-hpa
  namespace: nexus-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: trade-service
  
  minReplicas: 3    # Always maintain 3 pods for HA across zones
  maxReplicas: 20   # Scale up to 20 pods under peak load
  
  metrics:
    # Scale on CPU utilisation
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70  # Scale up when avg CPU > 70%
    
    # Scale on custom metric: Kafka consumer lag for trade events
    - type: External
      external:
        metric:
          name: kafka_consumer_lag
          selector:
            matchLabels:
              topic: nexus.trading.trades.created
              consumer_group: trade-service
        target:
          type: AverageValue
          averageValue: "1000"   # Scale up when consumer lag > 1000 messages
  
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60   # Wait 60s before scaling up again
      policies:
        - type: Pods
          value: 3                      # Add max 3 pods at a time
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300  # Wait 5 minutes before scaling down
      policies:
        - type: Pods
          value: 1                      # Remove max 1 pod at a time
          periodSeconds: 120

