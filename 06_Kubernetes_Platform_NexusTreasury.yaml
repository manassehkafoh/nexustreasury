# FILE: monitoring/grafana/dashboards/trading-operations.json
# Grafana Dashboard — Trading Operations (JSON model)
# Import via Grafana API or ConfigMap

{
  "title": "NexusTreasury — Trading Operations",
  "uid": "nexus-trading-ops",
  "tags": ["nexustreasury", "trading", "operations"],
  "timezone": "UTC",
  "refresh": "10s",
  "time": { "from": "now-1h", "to": "now" },
  "panels": [
    {
      "id": 1,
      "title": "Trade Booking Rate (trades/min)",
      "type": "timeseries",
      "gridPos": { "x": 0, "y": 0, "w": 8, "h": 8 },
      "targets": [
        {
          "expr": "rate(nexus_trades_booked_total[1m]) * 60",
          "legendFormat": "Trades per minute"
        }
      ]
    },
    {
      "id": 2,
      "title": "Trade Booking P99 Latency (ms)",
      "type": "gauge",
      "gridPos": { "x": 8, "y": 0, "w": 4, "h": 8 },
      "targets": [
        {
          "expr": "histogram_quantile(0.99, rate(http_request_duration_ms_bucket{path='/v1/trades',method='POST'}[5m]))",
          "legendFormat": "P99 Latency"
        }
      ],
      "fieldConfig": {
        "defaults": {
          "thresholds": {
            "steps": [
              { "color": "green", "value": 0 },
              { "color": "yellow", "value": 75 },
              { "color": "red", "value": 100 }
            ]
          },
          "max": 200,
          "unit": "ms"
        }
      }
    },
    {
      "id": 3,
      "title": "STP Rate (%)",
      "type": "gauge",
      "gridPos": { "x": 12, "y": 0, "w": 4, "h": 8 },
      "targets": [
        {
          "expr": "nexus_swift_stp_rate * 100",
          "legendFormat": "STP Rate"
        }
      ],
      "fieldConfig": {
        "defaults": {
          "thresholds": {
            "steps": [
              { "color": "red", "value": 0 },
              { "color": "yellow", "value": 85 },
              { "color": "green", "value": 95 }
            ]
          },
          "max": 100,
          "unit": "percent"
        }
      }
    },
    {
      "id": 4,
      "title": "Active Limit Breaches",
      "type": "stat",
      "gridPos": { "x": 16, "y": 0, "w": 4, "h": 8 },
      "targets": [
        {
          "expr": "nexus_active_limit_breaches_total",
          "legendFormat": "Active Breaches"
        }
      ],
      "fieldConfig": {
        "defaults": {
          "thresholds": {
            "steps": [
              { "color": "green", "value": 0 },
              { "color": "red", "value": 1 }
            ]
          }
        }
      }
    },
    {
      "id": 5,
      "title": "Trades by Asset Class (Today)",
      "type": "piechart",
      "gridPos": { "x": 0, "y": 8, "w": 8, "h": 8 },
      "targets": [
        {
          "expr": "sum by (asset_class) (increase(nexus_trades_booked_total[24h]))",
          "legendFormat": "{{asset_class}}"
        }
      ]
    },
    {
      "id": 6,
      "title": "Kafka Consumer Lag — All Topics",
      "type": "timeseries",
      "gridPos": { "x": 8, "y": 8, "w": 16, "h": 8 },
      "targets": [
        {
          "expr": "kafka_consumer_group_lag{namespace='nexus-prod'}",
          "legendFormat": "{{consumer_group}} / {{topic}}"
        }
      ]
    }
  ]
}

